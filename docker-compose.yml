services:
  # Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: dlms-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dlms-db}
    ports:
      - "5432:5432"
    volumes:
      - dlms_pg_data:/var/lib/postgresql/data
    networks:
      - dlms-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-dlms-db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO Storage
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: dlms-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dlms_minio_data:/data
    networks:
      - dlms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 5

  # MinIO Setup (create bucket)
  minio-setup:
    image: minio/mc:RELEASE.2023-11-20T16-30-59Z
    container_name: dlms-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dlms-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add minio http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb minio/dlms-documents --ignore-existing;
      /usr/bin/mc anonymous set public minio/dlms-documents || true;
      exit 0;
      "

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dlms-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-dlms-db}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dlms-network
    volumes:
      - ./backend/logs:/app/logs

  # FrontEnd React + Vite (Dùng Nginx cho Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dlms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dlms-network

networks:
  dlms-network:
    driver: bridge

volumes:
  dlms_pg_data:
  dlms_minio_data:
