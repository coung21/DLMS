server {
    listen 80;
    server_name dlms-vku.site www.dlms-vku.site;

    # 1. Phục vụ Frontend (React Static Files)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Chuyển tiếp các yêu cầu API đến Backend (FastAPI)
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cấu hình log để dễ dàng kiểm tra lỗi
    access_log /var/log/nginx/dlms_access.log;
    error_log /var/log/nginx/dlms_error.log;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
