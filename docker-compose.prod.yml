services:
  # Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: dlms-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dlms_pg_data_prod:/var/lib/postgresql/data
    networks:
      - dlms-network-prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Storage
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: dlms-minio-prod
    restart: always
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - dlms_minio_data_prod:/data
    networks:
      - dlms-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # MinIO Setup (create bucket)
  minio-setup:
    image: minio/mc:RELEASE.2023-11-20T16-30-59Z
    container_name: dlms-minio-setup-prod
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dlms-network-prod
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add minio http://minio:9000 $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY};
      /usr/bin/mc mb minio/dlms-documents --ignore-existing;
      /usr/bin/mc anonymous set public minio/dlms-documents || true;
      exit 0;
      "

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dlms-backend-prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dlms-network-prod
    volumes:
      - ./backend/logs:/app/logs

  # FrontEnd React + Vite (Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dlms-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - dlms-network-prod

  # Reverse Proxy (Nginx Proxy Manager)
  # Cho phép SSL tự động và quản lý domain dễ dàng
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: dlms-proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./proxy-data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - dlms-network-prod
    depends_on:
      - frontend
      - backend

networks:
  dlms-network-prod:
    driver: bridge

volumes:
  dlms_pg_data_prod:
  dlms_minio_data_prod:
